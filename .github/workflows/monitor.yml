name: Check published website
on:
  schedule:
    - cron: '23 1,13 * * *'
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
concurrency:
  group: published-site-monitor
  cancel-in-progress: false
jobs:
  published-site:
    if: github.repository == 'GladosAI/female-appearance-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Check the currently deployed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/monitor_online.py --repository "$GITHUB_REPOSITORY" --base https://gladosai.github.io/female-appearance-atlas/
