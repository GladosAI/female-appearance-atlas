name: 页面或工具故障
description: 检索、外观卡、导出、构建等问题
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 版本、浏览器、系统与访问方式
      placeholder: 内容65.0 / Edge / Windows / 本地双击或网站地址
  - type: textarea
    id: evidence
    attributes:
      label: 相关图鉴编号、截图或日志
      description: 隐去个人外观卡、提示词和私人路径。
